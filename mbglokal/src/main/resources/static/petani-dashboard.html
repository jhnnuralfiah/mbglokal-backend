<!DOCTYPE html>
<html lang="id">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Dashboard Petani</title>

    <link rel="stylesheet" href="css/style.css">

</head>

<body>

    <!-- ================= SIDEBAR ================= -->

    <div class="sidebar">

        <img src="img/logo.png" class="sidebar-logo">

        <h2>PETANI</h2>

        <ul>

            <li onclick="showPage('dashboard')">
                Dashboard
            </li>

            <li onclick="showPage('stok')">
                Stok Saya
            </li>

            <li onclick="showPage('permintaan')">
                Permintaan Admin
            </li>

        </ul>

        <button class="logout-btn" onclick="logout()">

            Logout

        </button>

    </div>

    <!-- ================= CONTENT ================= -->

    <div class="content">

        <!-- ================= DASHBOARD ================= -->

        <div id="dashboard" class="page">

            <div class="topbar">

                <h1>Dashboard Petani</h1>

            </div>

            <div class="card-container">

                <div class="card">

                    <h3>Total Komoditas</h3>

                    <p id="totalKomoditas">
                        0
                    </p>

                </div>

                <div class="card">

                    <h3>Total Permintaan</h3>

                    <p id="totalPermintaan">
                        0
                    </p>

                </div>

            </div>

        </div>

        <!-- ================= STOK PETANI ================= -->

        <div id="stok" class="page hidden">

            <div class="topbar">

                <h1>Stok Petani</h1>

            </div>

            <div class="form-box">

                <input type="text" id="namaKomoditas" placeholder="Nama Komoditas">

                <input type="number" id="stokKomoditas" placeholder="Jumlah Stok">

                <button class="add-btn" onclick="tambahKomoditas()">

                    Tambah Stok

                </button>

            </div>

            <table>

                <thead>

                    <tr>

                        <th>No</th>
                        <th>Komoditas</th>
                        <th>Stok Petani</th>

                    </tr>

                </thead>

                <tbody id="komoditasBody">

                </tbody>

            </table>

        </div>

        <!-- ================= PERMINTAAN ADMIN ================= -->

        <div id="permintaan" class="page hidden">

            <div class="topbar">

                <h1>Permintaan Admin</h1>

            </div>

            <table>

                <thead>

                    <tr>

                        <th>No</th>
                        <th>Komoditas</th>
                        <th>Jumlah</th>
                        <th>Status</th>

                    </tr>

                </thead>

                <tbody id="permintaanBody">

                </tbody>

            </table>

        </div>

    </div>

    <div id="toast"></div>

    <!-- ================= SCRIPT ================= -->
    <script src="js/script.js"></script>

</body>

</html>
