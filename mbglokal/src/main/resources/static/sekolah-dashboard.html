<!DOCTYPE html>
<html lang="id">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Dashboard Sekolah</title>

    <link rel="stylesheet" href="css/style.css">

</head>

<body>

    <!-- =========================
SIDEBAR
========================= -->

    <div class="sidebar">

        <img src="img/logo.png" class="sidebar-logo">

        <h2>SEKOLAH MBG</h2>

        <ul>

            <li onclick="showPage('dashboard')">
                Dashboard
            </li>

            <!-- <li onclick="showPage('jadwal')">
                Jadwal Makanan
            </li> -->

            <li onclick="showPage('distribusi')">
                Status Distribusi
            </li>

            <li onclick="showPage('komentar')">
                Komentar
            </li>

        </ul>

        <button class="logout-btn" onclick="logout()">

            Logout

        </button>

    </div>


    <!-- =========================
CONTENT
========================= -->

    <div class="content">

        <!-- ================= DASHBOARD ================= -->

        <div id="dashboard" class="page">

            <div class="topbar">

                <h1>Dashboard Sekolah</h1>

            </div>

            <div class="card-container">

                <div class="card">

                    <h3>Total Jadwal</h3>

                    <p id="totalJadwal">
                        0
                    </p>

                </div>

                <div class="card">

                    <h3>Total Distribusi</h3>

                    <p id="totalDistribusi">
                        0
                    </p>

                </div>

            </div>

        </div>


        <!-- ================= JADWAL ================= -->

        <div id="jadwal" class="page hidden">

            <div class="topbar">

                <h1>Jadwal Makanan</h1>

            </div>

            <div class="table-wrapper">

                <table>

                    <thead>

                        <tr>

                            <th>No</th>
                            <th>Paket</th>
                            <th>Sekolah</th>
                            <th>Porsi</th>
                            <th>Status</th>
                            <th>Aksi</th>

                        </tr>

                    </thead>

                    <tbody id="jadwalBody">

                    </tbody>

                </table>

            </div>

        </div>


        <!-- ================= DISTRIBUSI ================= -->

        <div id="distribusi" class="page hidden">

            <div class="topbar">

                <h1>Status Distribusi</h1>

            </div>

            <div class="table-wrapper">

                <table>

                    <thead>

                        <tr>

                            <th>No</th>
                            <th>Paket</th>
                            <th>Sekolah</th>
                            <th>Tanggal Distribusi</th>
                            <th>Porsi</th>
                            <th>Status</th>
                            <th>Aksi</th>

                        </tr>

                    </thead>

                    <tbody id="distribusiBody">

                    </tbody>

                </table>

            </div>

        </div>


        <!-- ================= KOMENTAR ================= -->

        <div id="komentar" class="page hidden">

            <div class="topbar">

                <h1>Komentar</h1>

            </div>

            <div class="form-box">

                <input type="text" id="namaSekolah" placeholder="Nama Sekolah">

                <input type="text" id="isiKomentar" placeholder="Tulis komentar">

                <button class="add-btn" onclick="tambahKomentar()">

                    Kirim

                </button>

            </div>

            <div class="table-wrapper">

                <table>

                    <thead>

                        <tr>

                            <th>No</th>
                            <th>Sekolah</th>
                            <th>Komentar</th>

                        </tr>

                    </thead>

                    <tbody id="komentarBody">

                    </tbody>

                </table>

            </div>

        </div>

    </div>

    <div id="toast"></div>

    <!-- =========================
JAVASCRIPT
========================= -->
    <script src="js/script.js"></script>

</body>

</html>
