<!DOCTYPE html>
<html lang="id">
<head>

    <meta charset="UTF-8">

    <meta name="viewport"
    content="width=device-width, initial-scale=1.0">

    <title>Dashboard Petani</title>

    <link rel="stylesheet"
    href="style.css">

</head>

<body>

<!-- ================= SIDEBAR ================= -->

<div class="sidebar">

    <img src="logo.png"
    class="sidebar-logo">

    <h2>PETANI</h2>

    <ul>

        <li onclick="showPage('dashboard')">
            Dashboard
        </li>

        <li onclick="showPage('stok')">
            Stok Saya
        </li>

        <li onclick="showPage('permintaan')">
            Permintaan Admin
        </li>

    </ul>

    <button class="logout-btn"
    onclick="logout()">

        Logout

    </button>

</div>

<!-- ================= CONTENT ================= -->

<div class="content">

    <!-- ================= DASHBOARD ================= -->

    <div id="dashboard"
    class="page">

        <div class="topbar">

            <h1>Dashboard Petani</h1>

        </div>

        <div class="card-container">

            <div class="card">

                <h3>Total Komoditas</h3>

                <p id="totalKomoditas">
                    0
                </p>

            </div>

            <div class="card">

                <h3>Total Permintaan</h3>

                <p id="totalPermintaan">
                    0
                </p>

            </div>

        </div>

    </div>

    <!-- ================= STOK PETANI ================= -->

    <div id="stok"
    class="page hidden">

        <div class="topbar">

            <h1>Stok Petani</h1>

        </div>

        <div class="form-box">

            <input type="text"
            id="namaKomoditas"
            placeholder="Nama Komoditas">

            <input type="number"
            id="stokKomoditas"
            placeholder="Jumlah Stok">

            <button class="add-btn"
            onclick="tambahKomoditas()">

                Tambah Stok

            </button>

        </div>

        <table>

            <thead>

                <tr>

                    <th>No</th>
                    <th>Komoditas</th>
                    <th>Stok Petani</th>

                </tr>

            </thead>

            <tbody id="komoditasBody">

            </tbody>

        </table>

    </div>

    <!-- ================= PERMINTAAN ADMIN ================= -->

    <div id="permintaan"
    class="page hidden">

        <div class="topbar">

            <h1>Permintaan Admin</h1>

        </div>

        <table>

            <thead>

                <tr>

                    <th>No</th>
                    <th>Komoditas</th>
                    <th>Jumlah</th>
                    <th>Status</th>

                </tr>

            </thead>

            <tbody id="permintaanBody">

            </tbody>

        </table>

    </div>

</div>

<!-- ================= SCRIPT ================= -->

<script>

// ==========================
// SHOW PAGE
// ==========================

function showPage(page){

    let pages =
    document.querySelectorAll(
    ".page");

    pages.forEach(function(item){

        item.classList.add(
        "hidden");
    });

    document.getElementById(
    page).classList.remove(
    "hidden");
}

// ==========================
// LOGOUT
// ==========================

function logout(){

    localStorage.removeItem(
    "role");

    window.location.href =
    "login.html";
}

// ==========================
// KOMODITAS PETANI
// ==========================

let komoditas =
JSON.parse(
localStorage.getItem(
"komoditas")) || [];

function tambahKomoditas(){

    let nama =
    document.getElementById(
    "namaKomoditas").value;

    let stok =
    document.getElementById(
    "stokKomoditas").value;

    if(!nama || !stok){
        return;
    }

    komoditas.push({

        nama,
        stok

    });

    localStorage.setItem(

        "komoditas",

        JSON.stringify(
        komoditas)

    );

    loadKomoditas();

    document.getElementById(
    "namaKomoditas").value = "";

    document.getElementById(
    "stokKomoditas").value = "";
}

function loadKomoditas(){

    let body =
    document.getElementById(
    "komoditasBody");

    if(!body) return;

    body.innerHTML = "";

    komoditas.forEach((item,i)=>{

        body.innerHTML += `

        <tr>

            <td>${i+1}</td>

            <td>${item.nama}</td>

            <td>${item.stok} kg</td>

        </tr>

        `;
    });

    let total =
    document.getElementById(
    "totalKomoditas");

    if(total){

        total.innerText =
        komoditas.length;
    }
}

// ==========================
// PERMINTAAN ADMIN
// ==========================

let pesanan =
JSON.parse(
localStorage.getItem(
"pesanan")) || [];

function loadPermintaan(){

    let body =
    document.getElementById(
    "permintaanBody");

    if(!body) return;

    body.innerHTML = "";

    pesanan.forEach((item,i)=>{

        body.innerHTML += `

        <tr>

            <td>${i+1}</td>

            <td>${item.komoditas}</td>

            <td>${item.jumlah} kg</td>

            <td>

                <select onchange="
                updateStatus(
                ${i},
                this.value
                )">

                    <option value="Menunggu"
                    ${item.status === "Menunggu"
                    ? "selected" : ""}>

                        Menunggu

                    </option>

                    <option value="Diproses"
                    ${item.status === "Diproses"
                    ? "selected" : ""}>

                        Diproses

                    </option>

                    <option value="Selesai"
                    ${item.status === "Selesai"
                    ? "selected" : ""}>

                        Selesai

                    </option>

                </select>

            </td>

        </tr>

        `;
    });

    totalPermintaan();
}

// ==========================
// GUDANG MBG
// ==========================

let gudang =
JSON.parse(
localStorage.getItem(
"gudang")) || [];

function tambahGudang(
komoditas,
jumlah
){

    let ditemukan =
    gudang.find(item =>
    item.nama === komoditas);

    if(ditemukan){

        ditemukan.stok =
        parseInt(
        ditemukan.stok)
        +
        parseInt(jumlah);
    }

    else{

        gudang.push({

            nama:komoditas,
            stok:parseInt(jumlah)

        });
    }

    localStorage.setItem(

        "gudang",

        JSON.stringify(
        gudang)

    );
}

// ==========================
// UPDATE STATUS
// ==========================

function updateStatus(index,status){

    pesanan[index].status =
    status;

    if(status === "Selesai"){

        tambahGudang(

            pesanan[index].komoditas,

            pesanan[index].jumlah

        );
    }

    localStorage.setItem(

        "pesanan",

        JSON.stringify(
        pesanan)

    );

    loadPermintaan();
}

// ==========================
// TOTAL PERMINTAAN
// ==========================

function totalPermintaan(){

    let total =
    document.getElementById(
    "totalPermintaan");

    if(total){

        total.innerText =
        pesanan.length;
    }
}

// ==========================
// AUTO LOAD
// ==========================

window.onload = function(){

    loadKomoditas();

    loadPermintaan();

    totalPermintaan();
}

</script>

</body>
</html>
