<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport"
    content="width=device-width, initial-scale=1.0">

    <title>Login MBG</title>

    <link rel="stylesheet"
    href="style.css">
</head>

<body>

<div class="left-side">

    <img src="logo.png"
    class="big-logo">

    <h1>
        BADAN GIZI
        NASIONAL
    </h1>

    <p>
        Sistem Monitoring MBG
    </p>

</div>

<div class="login-container">

    <img src="logo.png"
    class="logo">

    <h2>LOGIN</h2>

    <p class="subtitle">
        Login sesuai role
    </p>

    <input type="text"
    id="username"
    placeholder="Username">

    id="password"
    placeholder="Password">

    <button onclick="login()">
        LOGIN
    </button>

    <p id="error"></p>

</div>

<script src="script.js"></script>

</body>
</html>
